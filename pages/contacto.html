<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Plantilla Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar bg-primary navbar-expand-lg">
        <div class="container">
          <a href="../index.html" class="navbar-brand text-white"
            >Plantilla de bootstrap</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#opcionesMenu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="opcionesMenu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="../index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="grilla.html">Grilla</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="contacto.html">Contacto</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <h1 class="mb-4">Formularios con Stacks</h1>

          <section
            class="border border-secondary-subtle p-4 rounded-3 shadow-sm"
          >
            <form>
              <div class="vstack gap-3">
                <div>
                  <label for="nombre" class="form-label fw-bold">Nombre</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    placeholder="Ej: Juan"
                  />
                </div>

                <div>
                  <label for="email" class="form-label fw-bold">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="test@ejemplo.com"
                  />
                </div>

                <div>
                  <label for="mensaje" class="form-label fw-bold"
                    >Mensaje</label
                  >
                  <textarea
                    class="form-control"
                    id="mensaje"
                    rows="4"
                    placeholder="agrega aquí tu mensaje"
                  ></textarea>
                </div>

                <div class="form-check form-switch">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    role="switch"
                    id="flexSwitchCheckDefault"
                  />
                  <label class="form-check-label" for="flexSwitchCheckDefault"
                    >Aceptar términos (Switch)</label
                  >
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Enviar
                </button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </main>
    <footer class="bg-black py-4 mt-auto">
      <div class="container text-center">
        <p class="mb-0 text-white">© Todos los derechos reservados 2026</p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
